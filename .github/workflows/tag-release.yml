name: Autotag and Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - run: make tag-release
        env:
          GH_TOKEN: ${{ github.token }}
