name: Autotag and Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make tag-release
        env:
          GH_TOKEN: ${{ github.token }}
